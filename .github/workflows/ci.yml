name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '${{ matrix.python }}' }
      - run: pip install -e ".[dev]"
      - run: pytest -q
  self-scan:
    # Dogfood: Maroon Elephant scans itself and publishes its AT x L result.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - run: pip install -e .
      - name: Self-scan with Maroon Elephant's own rules (must be clean; fail on High+)
        # Dogfood = Maroon Elephant's NATIVE rules on its own source. Grey Panda is an
        # optional third-party sub-scanner with its own opinions, so it is not part of this
        # determinism claim; run it separately if you want its view.
        run: maroon scan . --no-subscanners --fail-on high -f sarif -o maroon.sarif
      - name: Governance verdict
        if: always()
        run: maroon scan . -f tmac | python -c "import sys,json; g=json.load(sys.stdin)['governance']; print('Maroon Elephant governance:', g['adoption_tier'],'x',g['governance_level'],'->',g['verdict'])"
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: maroon.sarif
          category: maroon-elephant
